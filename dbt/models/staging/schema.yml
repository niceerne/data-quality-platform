version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: customers
      - name: orders
  - name: dq
    schema: dq
    tables:
      - name: check_results
      - name: run_log

models:
  - name: stg_customers
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: email
        tests: [not_null]
  - name: stg_orders
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests: [not_null]
      - name: amount
        tests:
          - not_null
