dqp:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'postgres') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      user: "{{ env_var('POSTGRES_USER', 'dqp') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'dqp_password') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'dqp') }}"
      schema: public
      threads: 2
